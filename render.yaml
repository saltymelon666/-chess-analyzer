services:
  - type: web
    name: ai-chess-review-api
    runtime: docker
    # Keep the API warm so the first analysis request does not pay the Free-tier
    # spin-up delay. This is the lowest paid Web Service instance type.
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: APP_ENV
        value: production
      - key: BILLING_ENFORCED
        value: "true"
      - key: PAYMENT_CALLBACK_SECRET
        generateValue: true
      - key: PAYMENT_CHECKOUT_BASE_URL
        sync: false
      - key: PAYMENT_PUBLIC_ORIGIN
        sync: false
      - key: PAYMENT_FRONTEND_ORIGIN
        sync: false
      - key: WECHAT_PAY_MCH_ID
        sync: false
      - key: WECHAT_PAY_APP_ID
        sync: false
      - key: WECHAT_PAY_CERT_SERIAL
        sync: false
      - key: WECHAT_PAY_PRIVATE_KEY
        sync: false
      - key: WECHAT_PAY_API_V3_KEY
        sync: false
      - key: WECHAT_PAY_PLATFORM_PUBLIC_KEY
        sync: false
      - key: WECHAT_PAY_PLATFORM_SERIAL
        sync: false
      - key: ALIPAY_APP_ID
        sync: false
      - key: ALIPAY_PRIVATE_KEY
        sync: false
      - key: ALIPAY_PUBLIC_KEY
        sync: false
      - key: ALIPAY_SELLER_ID
        sync: false
      - key: MANUAL_WECHAT_QR_URL
        value: /assets/payment/wechat-personal-qr.webp
      - key: MANUAL_ALIPAY_QR_URL
        value: /assets/payment/alipay-personal-qr.webp
      - key: STOCKFISH_PATH
        value: /usr/local/bin/stockfish
      - key: STOCKFISH_DEPTH
        value: "14"
      - key: STOCKFISH_THREADS
        value: "1"
      - key: STOCKFISH_HASH
        value: "256"
      - key: STOCKFISH_MULTIPV
        value: "3"
      - key: STOCKFISH_TIMEOUT_SECONDS
        value: "90"
      - key: GAME_ANALYSIS_DEPTH
        value: "20"
      - key: GAME_ANALYSIS_TIMEOUT_SECONDS
        value: "1200"
      - key: GAME_ANALYSIS_MAX_PLIES
        value: "200"
      - key: DEEPSEEK_TIMEOUT_SECONDS
        value: "30"
      - key: ALLOWED_ORIGINS
        value: https://pawnlab.cn,https://www.pawnlab.cn,https://pawnlab-9e0.pages.dev,https://saltymelon666.github.io,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8501,http://127.0.0.1:8501
      - key: ANALYTICS_DATABASE_URL
        fromDatabase:
          name: pawnlab-analytics
          property: connectionString
      - key: ANALYTICS_PERSISTENT_STORAGE
        value: "true"
      - key: ADMIN_STATISTICS_KEY
        generateValue: true
      - key: DEEPSEEK_INPUT_PRICE_PER_MILLION
        value: "0.14"
      - key: DEEPSEEK_OUTPUT_PRICE_PER_MILLION
        value: "0.28"

databases:
  - name: pawnlab-analytics
    plan: free
    databaseName: pawnlab_analytics
    user: pawnlab_analytics
