services:
  - type: web
    name: ai-chess-review-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: APP_ENV
        value: production
      - key: STOCKFISH_PATH
        value: /usr/local/bin/stockfish
      - key: STOCKFISH_DEPTH
        value: "14"
      - key: STOCKFISH_THREADS
        value: "1"
      - key: STOCKFISH_HASH
        value: "64"
      - key: STOCKFISH_MULTIPV
        value: "3"
      - key: STOCKFISH_TIMEOUT_SECONDS
        value: "45"
      - key: GAME_ANALYSIS_DEPTH
        value: "10"
      - key: GAME_ANALYSIS_TIMEOUT_SECONDS
        value: "240"
      - key: GAME_ANALYSIS_MAX_PLIES
        value: "160"
      - key: DEEPSEEK_TIMEOUT_SECONDS
        value: "30"
      - key: ALLOWED_ORIGINS
        value: https://pawnlab.cn,https://www.pawnlab.cn,https://pawnlab-9e0.pages.dev,https://saltymelon666.github.io,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8501,http://127.0.0.1:8501
